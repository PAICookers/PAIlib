name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_TAG="v$(uv version --short)"
          if [ "$PACKAGE_TAG" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_TAG" >&2
            exit 1
          fi

      - name: Build
        run: uv build --no-sources

      - name: Publish
        run: uv publish
